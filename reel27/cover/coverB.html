<!doctype html><html lang="en"><head><meta charset="UTF-8"><style>
@font-face{font-family:"PopFz";font-weight:800;src:url("assets/fonts/pop800.woff2") format("woff2")}
@font-face{font-family:"PopFz";font-weight:700;src:url("assets/fonts/pop700.woff2") format("woff2")}
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#fff;font-family:"PopFz",sans-serif;position:relative;overflow:hidden;color:#0b0b14}
.glow{position:absolute;left:-250px;top:800px;width:1580px;height:1100px;background:radial-gradient(closest-side,#e6f0ff,#fff 78%)}
.pill{position:absolute;left:0;top:200px;width:1080px;display:flex;justify-content:center}
.pill span{background:#0b0b14;color:#fff;font-weight:800;font-size:44px;padding:12px 46px;border-radius:60px;letter-spacing:1.5px}
.t{position:absolute;left:0;width:1080px;text-align:center;font-weight:800;letter-spacing:-3px;line-height:1.05;white-space:nowrap}
.t1{top:335px;font-size:108px;color:#c8102e}
.t2{top:500px;font-size:70px;color:#334155;letter-spacing:-1px}
.grid{position:absolute;left:130px;top:690px;width:820px;display:grid;grid-template-columns:1fr 1fr;gap:26px 28px}
.g{height:300px;display:flex;align-items:center;justify-content:center}
.g img{max-width:396px;max-height:300px;width:auto;height:auto;border-radius:24px;box-shadow:0 16px 40px rgba(0,0,0,.26);border:6px solid #fff}
.g:nth-child(1){transform:rotate(-2.5deg)}.g:nth-child(2){transform:rotate(2.5deg)}.g:nth-child(3){transform:rotate(2deg)}.g:nth-child(4){transform:rotate(-2deg)}
.char{position:absolute;left:50%;transform:translateX(-50%);top:1370px;height:440px}
.wm{position:absolute;left:0;bottom:55px;width:1080px;text-align:center;font-weight:700;font-size:42px;color:#374151}
</style></head><body>
<div class="glow"></div>
<div class="pill"><span>WHICH PLANE?</span></div>
<div class="t t1">Boeing vs Airbus</div>
<div class="t t2">A380 &amp; Boeing 777</div>
<div class="grid">
<div class="g"><img src="assets/boeing_tile.jpg" alt=""></div>
<div class="g"><img src="assets/airbus_tile.jpg" alt=""></div>
<div class="g"><img src="assets/a380_tile.jpg" alt=""></div>
<div class="g"><img src="assets/b777_tile.jpg" alt=""></div>
</div>
<img class="char" src="assets/pose_think.png" alt="">
<div class="wm">@fyze.ai</div>
</body></html>
