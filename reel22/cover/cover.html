<!doctype html><html lang="en"><head><meta charset="UTF-8"><style>
@font-face{font-family:"PopFz";font-weight:800;src:url("assets/fonts/pop800.woff2") format("woff2")}
@font-face{font-family:"PopFz";font-weight:700;src:url("assets/fonts/pop700.woff2") format("woff2")}
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#fff;font-family:"PopFz",sans-serif;position:relative;overflow:hidden;color:#0b0b14}
.glow{position:absolute;left:-250px;top:700px;width:1580px;height:1200px;background:radial-gradient(closest-side,#e6ecff,#fff 78%)}
.pill{position:absolute;left:0;top:220px;width:1080px;display:flex;justify-content:center}
.pill span{background:#2330c9;color:#fff;font-weight:800;font-size:44px;padding:12px 44px;border-radius:60px;letter-spacing:1.5px}
.t{position:absolute;left:0;width:1080px;text-align:center;font-weight:800;letter-spacing:-3px;line-height:1.05;white-space:nowrap}
.t1{top:350px;font-size:124px;color:#0a8f4a}
.vs{position:absolute;left:0;top:545px;width:1080px;display:flex;justify-content:center}
.vs span{background:#d97757;color:#fff;font-weight:800;font-size:64px;padding:6px 46px;border-radius:50px;box-shadow:0 12px 28px rgba(217,119,87,.4)}
.t3{top:655px;font-size:124px;color:#e8590c}
.cell{position:absolute;top:880px;width:440px;height:340px;border-radius:30px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.28);border:8px solid #fff}
.cell img{width:100%;height:100%;object-fit:cover;display:block}
.cell b{position:absolute;left:14px;bottom:14px;background:#fff;color:#0b0b14;font-weight:800;font-size:34px;padding:6px 20px;border-radius:30px;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.cell.l{left:100px;transform:rotate(-4deg)}.cell.r{right:100px;transform:rotate(4deg)}
.price{position:absolute;left:0;top:1255px;width:1080px;display:flex;justify-content:center;gap:18px}
.price span{font-weight:800;font-size:44px;padding:10px 30px;border-radius:50px;color:#fff;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.char{position:absolute;left:50%;transform:translateX(-50%);top:1345px;height:470px}
.wm{position:absolute;left:0;bottom:60px;width:1080px;text-align:center;font-weight:700;font-size:42px;color:#374151}
</style></head><body>
<div class="glow"></div>
<div class="pill"><span>WHAT'S THE DIFFERENCE?</span></div>
<div class="t t1">Dubai Petrol</div>
<div class="vs"><span>VS</span></div>
<div class="t t3">Kerala Petrol</div>
<div class="cell l"><img src="assets/dubai_pump.jpg" alt=""><b>Dubai</b></div>
<div class="cell r"><img src="assets/kerala_pump.jpg" alt=""><b>Kerala</b></div>
<div class="price"><span style="background:#0a8f4a">₹104</span><span style="background:#d97757">₹114</span><span style="background:#e11d48">₹167</span></div>
<img class="char" src="assets/pose_think.png" alt="">
<div class="wm">@fyze.ai</div>
</body></html>
