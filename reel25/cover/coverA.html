<!doctype html><html lang="en"><head><meta charset="UTF-8"><style>
@font-face{font-family:"PopFz";font-weight:800;src:url("assets/fonts/pop800.woff2") format("woff2")}
@font-face{font-family:"PopFz";font-weight:700;src:url("assets/fonts/pop700.woff2") format("woff2")}
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#fff;font-family:"PopFz",sans-serif;position:relative;overflow:hidden;color:#0b0b14}
.glow{position:absolute;left:-250px;top:700px;width:1580px;height:1200px;background:radial-gradient(closest-side,#e6ecff,#fff 78%)}
.pill{position:absolute;left:0;top:200px;width:1080px;display:flex;justify-content:center}
.pill span{background:#2330c9;color:#fff;font-weight:800;font-size:44px;padding:12px 44px;border-radius:60px;letter-spacing:1.5px}
.t{position:absolute;left:0;width:1080px;text-align:center;font-weight:800;letter-spacing:-3px;line-height:1.05;white-space:nowrap}
.t1{top:325px;font-size:118px;color:#0b0b14}
.t2{top:465px;font-size:104px;color:#2330c9}
.grid{position:absolute;left:130px;top:700px;width:820px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:22px}
.c{height:280px;border-radius:26px;overflow:hidden;box-shadow:0 14px 34px rgba(0,0,0,.22);border:6px solid #fff}
.c img{width:100%;height:100%;object-fit:cover;display:block}
.row2 .c img{object-fit:contain;background:#fff}
.c:nth-child(odd){transform:rotate(-2deg)}.c:nth-child(even){transform:rotate(2deg)}
.row2{position:absolute;left:130px;top:1030px;width:820px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:22px}
.char{position:absolute;left:50%;transform:translateX(-50%);top:1370px;height:440px}
.wm{position:absolute;left:0;bottom:55px;width:1080px;text-align:center;font-weight:700;font-size:42px;color:#374151}
</style></head><body>
<div class="glow"></div>
<div class="pill"><span>WHO OWNS IT?</span></div>
<div class="t t1">Malayali</div>
<div class="t t2">Business Giants</div>
<div class="grid">
<div class="c"><img src="assets/p_lulu.jpg" alt=""></div>
<div class="c"><img src="assets/p_aster.jpg" alt=""></div>
<div class="c"><img src="assets/p_rp.jpg" alt=""></div>
</div>
<div class="row2">
<div class="c"><img src="assets/l_lulu.jpg" alt=""></div>
<div class="c"><img src="assets/l_aster.jpg" alt=""></div>
<div class="c"><img src="assets/l_rp.jpg" alt=""></div>
</div>
<img class="char" src="assets/pose_think.png" alt="">
<div class="wm">@fyze.ai</div>
</body></html>
