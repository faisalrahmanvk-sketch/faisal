<!doctype html><html lang="en"><head><meta charset="UTF-8"><style>
@font-face{font-family:"PopFz";font-weight:800;src:url("assets/fonts/pop800.woff2") format("woff2")}
@font-face{font-family:"PopFz";font-weight:700;src:url("assets/fonts/pop700.woff2") format("woff2")}
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#fff;font-family:"PopFz",sans-serif;position:relative;overflow:hidden;color:#0b0b14}
.glow{position:absolute;left:-250px;top:800px;width:1580px;height:1100px;background:radial-gradient(closest-side,#fff1e6,#fff 78%)}
.pill{position:absolute;left:0;top:200px;width:1080px;display:flex;justify-content:center}
.pill span{background:#0b0b14;color:#fff;font-weight:800;font-size:44px;padding:12px 46px;border-radius:60px;letter-spacing:1.5px}
.t{position:absolute;left:0;width:1080px;text-align:center;font-weight:800;letter-spacing:-3px;line-height:1.05;white-space:nowrap}
.t1{top:330px;font-size:136px;color:#c8102e}
.t2{top:490px;font-size:66px;color:#334155;letter-spacing:-1px}
.faces{position:absolute;left:0;top:700px;width:1080px;display:flex;justify-content:center}
.f{width:190px;height:250px;border-radius:30px;overflow:hidden;border:7px solid #fff;box-shadow:0 18px 40px rgba(0,0,0,.28);margin:0 -10px}
.f img{width:100%;height:100%;object-fit:cover;object-position:50% 22%;display:block}
.f:nth-child(1){transform:rotate(-7deg) translateY(18px)}.f:nth-child(2){transform:rotate(-3deg) translateY(4px)}.f:nth-child(3){transform:rotate(0deg);z-index:2;width:215px;height:280px}.f:nth-child(4){transform:rotate(3deg) translateY(4px)}.f:nth-child(5){transform:rotate(7deg) translateY(18px)}
.logos{position:absolute;left:0;top:1090px;width:1080px;display:flex;justify-content:center;gap:12px}
.l{width:150px;height:106px;border-radius:22px;overflow:hidden;border:5px solid #fff;box-shadow:0 10px 26px rgba(0,0,0,.2)}
.l img{width:100%;height:100%;object-fit:cover;display:block}
.char{position:absolute;left:50%;transform:translateX(-50%);top:1290px;height:520px}
.wm{position:absolute;left:0;bottom:55px;width:1080px;text-align:center;font-weight:700;font-size:42px;color:#374151}
</style></head><body>
<div class="glow"></div>
<div class="pill"><span>DO YOU KNOW THEM?</span></div>
<div class="t t1">Kerala's</div>
<div class="t t2">Biggest Business Owners</div>
<div class="faces">
<div class="f"><img src="assets/p_lulu.jpg" alt=""></div>
<div class="f"><img src="assets/p_aster.jpg" alt=""></div>
<div class="f"><img src="assets/p_rp.jpg" alt=""></div>
<div class="f"><img src="assets/p_sobha.jpg" alt=""></div>
<div class="f"><img src="assets/p_joy.jpg" alt=""></div>
</div>
<div class="logos">
<div class="l"><img src="assets/l_lulu.jpg" alt=""></div><div class="l"><img src="assets/l_aster.jpg" alt=""></div><div class="l"><img src="assets/l_rp.jpg" alt=""></div><div class="l"><img src="assets/l_sobha.jpg" alt=""></div><div class="l"><img src="assets/l_joy.jpg" alt=""></div>
</div>
<img class="char" src="assets/pose_think.png" alt="">
<div class="wm">@fyze.ai</div>
</body></html>
