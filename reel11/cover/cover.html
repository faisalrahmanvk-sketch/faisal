<!doctype html><html lang="ml"><head><meta charset="UTF-8"><style>
@font-face{font-family:"NotoMal";font-weight:800;src:url("assets/fonts/mal800.woff2") format("woff2")}
@font-face{font-family:"PopFz";font-weight:800;src:url("assets/fonts/pop800.woff2") format("woff2")}
@font-face{font-family:"PopFz";font-weight:700;src:url("assets/fonts/pop700.woff2") format("woff2")}
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#fff;font-family:"PopFz","NotoMal",sans-serif;position:relative;overflow:hidden}
.glow{position:absolute;left:-200px;top:520px;width:1480px;height:1100px;background:radial-gradient(closest-side,#e8eeff,#fff 75%)}

.pill{background:#2330c9;color:#fff;font-weight:800;font-size:60px;padding:14px 44px;border-radius:60px}
.title{position:absolute;left:60px;right:60px;top:380px;text-align:center;font-weight:800;font-size:104px;line-height:1.3;color:#0b0b14}
.title .cv{display:inline-block;background:#2330c9;color:#fff;padding:0 34px;border-radius:26px;margin:0 6px}
.title .red{color:#e11d48}
.sub{position:absolute;left:0;top:860px;width:1080px;text-align:center;font-weight:700;font-size:40px;color:#475569}
.sub b{color:#d97757}
.char{position:absolute;left:50%;transform:translateX(-50%);top:950px;height:790px}
.emoji{position:absolute;left:640px;top:1010px;font-size:150px}
.wm{position:absolute;left:0;bottom:70px;width:1080px;text-align:center;font-weight:700;font-size:42px;color:#374151}
</style></head><body>
<div class="glow"></div>
<div class="top"><div class="pill">2027</div><img src="assets/claude.png" alt="Claude"></div>

<div class="sub">ATS-friendly CV · <b>Claude AI</b> ഉപയോഗിച്ച്</div>
<img class="char" src="assets/pose_think.png" alt="">
<div class="emoji">😳</div>
<div class="wm">@fyze.ai</div>
</body></html>
