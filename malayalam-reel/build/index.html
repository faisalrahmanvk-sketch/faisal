<!doctype html>
<html><head><meta charset="utf-8">
<style>
:root{--blue:#2a5bd7;--ink:#111;--grey:#8a8f98}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:720px;height:1280px;overflow:hidden;background:#fff}
body{font-family:'Inter','Inter Display',sans-serif;color:var(--ink);position:relative;
 background-image:radial-gradient(#e9ecf2 1.2px,transparent 1.3px);background-size:36px 36px;background-color:#fff}
.scene{position:absolute;inset:0;opacity:0}
.tag{position:absolute;left:60px;right:60px;top:96px;height:56px;border-bottom:2px solid #e3e5ea;display:flex;align-items:flex-start;gap:12px;font-size:20px;letter-spacing:.5px;font-weight:500}
.tag b{display:inline-flex;width:34px;height:34px;border-radius:8px;background:var(--ink);color:#fff;align-items:center;justify-content:center;font-size:18px}
.tag span{line-height:34px}
.h{position:absolute;left:0;right:0;text-align:center;font-weight:700;letter-spacing:-1px}
.h1{font-size:66px;top:200px;line-height:1.05}
.acc{font-family:'Liberation Serif','FreeSerif',serif;font-style:italic;font-weight:400;color:var(--blue);letter-spacing:-1px}
.h .acc{display:block;font-size:84px;margin-top:6px}
.abs{position:absolute}
.c{left:0;right:0;text-align:center}
.lbl{font-weight:600;font-size:28px}
.small{font-size:19px;color:#555}
.ch{position:absolute;bottom:0;height:470px;overflow:hidden;width:360px}
.ch img{position:absolute;top:0;height:860px}
.card{background:#fff;border:2px solid #dfe3ea;border-radius:16px;box-shadow:0 10px 30px rgba(30,50,110,.08)}
.btn{background:var(--blue);color:#fff;border-radius:12px;padding:12px 28px;font-weight:600;font-size:22px;display:inline-block}
.btn.o{background:#fff;color:#222;border:2px solid #dfe3ea}
svg{overflow:visible}

{s:32.2,e:34.6,tag:[2,'THE EDITING ENGINE'],title:'FFmpeg',acc:'Cut. Export.',body:'<div class="abs c" data-d=".3" style="top:520px"><svg width="520" height="110" viewBox="0 0 520 110"><rect width="520" height="110" rx="6" fill="#111"/><g fill="#fff">'+Array.from({length:20},(_,i)=>`<rect x="${10+i*26}" y="6" width="14" height="10" rx="2"/><rect x="${10+i*26}" y="94" width="14" height="10" rx="2"/>`).join('')+'</g><rect x="14" y="22" width="150" height="66" fill="#2a5bd7"/><rect x="178" y="22" width="160" height="66" fill="#4b78e6"/><rect x="352" y="22" width="154" height="66" fill="#2a5bd7"/></svg></div><div class="abs c small" data-d=".9" style="top:680px;font-size:22px">Close the gaps.</div><div class="abs c" data-d="1.3" style="top:760px"><span class="btn">Export MP4</span></div>',ch:['left','r']},

{s:76.8,e:81.6,top:'<div class="abs c small" data-d=".1" style="top:196px;font-size:32px;font-weight:600;color:#111">Comment</div><div class="abs c" data-d=".25" style="top:240px;font-size:92px;font-weight:600;color:var(--blue);letter-spacing:-1px;border-bottom:4px solid var(--blue);display:inline-block;left:130px;right:130px">EDITOR</div><div class="abs c small" data-d=".6" style="top:380px;font-size:22px">Get all three prompts.</div><div class="abs" data-d="1.2" style="left:130px;top:460px;display:flex;gap:30px">'+['01','02','03'].map(n=>`<div class="card" style="width:130px;height:170px;padding:22px;font-family:serif;font-style:italic;font-size:32px;color:#2a5bd7">${n}<div style="margin-top:18px;height:6px;background:#dbe5ff"></div><div style="margin-top:10px;height:6px;background:#dbe5ff;width:70%"></div></div>`).join('')+'</div><div class="abs c small" data-d="2.4" style="top:740px;font-size:24px">Next: my own <span class="acc" style="font-size:32px">editing style.</span></div>',ch:['left','r']},

const stage=document.getElementById('stage');
const els=S.map(sc=>{
  const d=document.createElement('div');d.className='scene';
  let h='';
  if(sc.tag){ if(sc.tag[0]) h+=`<div class="tag" data-d="0"><b>${sc.tag[0]}</b><span>${sc.tag[1]}</span></div>`;
    h+=`<div class="h h1" data-d=".1">${sc.title}<span class="acc" data-d=".35">${sc.acc}</span></div>`; h+=sc.body||''; }
  else h+=sc.top;
  // character
  const side=sc.ch[1], img=sc.ch[0];
  const big=sc.big;
  const W=big?460:300, H=big?640:390, Hh=big?1180:700;
  let pos= side==='l'?'left:10px':side==='r'?'right:10px':'left:'+(720-W)/2+'px';
  if(side==='c'&&big){ pos='left:130px' }
  h+=`<div class="ch" data-ch="1" style="${pos};width:${W}px;height:${H}px"><img src="assets/char_${img==='think'?'think':img==='right'?'right':'left'}.png" style="height:${Hh}px;left:50%;transform:translateX(-50%)"></div>`;
  d.innerHTML=h;stage.appendChild(d);
  d._items=[...d.querySelectorAll('[data-d]')].map(n=>({n,d:parseFloat(n.dataset.d)}));
  d._ch=d.querySelector('[data-ch]');
  return d;
});
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>1-Math.pow(1-x,3);
window.render=function(t){
  S.forEach((sc,i)=>{
    const el=els[i],lt=t-sc.s,dur=sc.e-sc.s;
    if(sc.skip){el.style.opacity=0;el.style.visibility='hidden';return}
    if(lt<-0.01||lt>dur+0.01){el.style.opacity=0;el.style.visibility='hidden';return}
    el.style.visibility='visible';
    const o=Math.min(clamp(lt/.3),clamp((dur-lt)/.25));
    el.style.opacity=o;
    el._items.forEach(({n,d})=>{const p=ease(clamp((lt-d)/.55));n.style.opacity=p;n.style.transform=`translateY(${(1-p)*26}px)`});
    const pc=ease(clamp((lt-.15)/.6));
    el._ch.style.transform=`translateY(${(1-pc)*220}px)`;
  });
};
window.setTiming=function(tj){
  tj.scenes.forEach((t,i)=>{
    const sc=S[i],old=sc.e-sc.s,nw=t.e-t.s,f=Math.min(1.6,Math.max(.45,nw/old));
    els[i]._items.forEach(it=>{if(it.d0===undefined)it.d0=it.d;it.d=it.d0*f});
    sc.s=t.s;sc.e=t.e;sc.skip=!!t.skip;
  });
};
window.getEvents=function(){
  const ev=[];let last=-1;
  S.forEach((sc,i)=>{
    if(sc.skip)return;
    ev.push({t:sc.s,type:'whoosh',scene:i});
    els[i]._items.forEach(({n,d})=>{
      if(n.closest('.h')||n.classList.contains('tag')||d<.25)return;
      const t=sc.s+d; if(t-last<.18||t>sc.e-.2)return; last=t;
      ev.push({t,type:n.querySelector('.btn')||n.classList.contains('btn')?'click':'pop',scene:i});
    });
  });
  return ev;
};
render(0);
</script></body></html>
