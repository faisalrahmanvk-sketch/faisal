<!doctype html><html lang="en"><head><meta charset="UTF-8"><style>
@font-face{font-family:"PopFz";font-weight:800;src:url("assets/fonts/pop800.woff2") format("woff2")}
@font-face{font-family:"PopFz";font-weight:700;src:url("assets/fonts/pop700.woff2") format("woff2")}
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#fff;font-family:"PopFz",sans-serif;position:relative;overflow:hidden;color:#0b0b14}
.glow{position:absolute;left:-250px;top:800px;width:1580px;height:1200px;background:radial-gradient(closest-side,#e6ecff,#fff 78%)}
.pill{position:absolute;left:0;top:190px;width:1080px;display:flex;justify-content:center}
.pill span{background:#2330c9;color:#fff;font-weight:800;font-size:46px;padding:12px 46px;border-radius:60px;letter-spacing:1.5px}
.panel{position:absolute;top:300px;width:490px;height:900px;border-radius:40px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.28);border:8px solid #fff}
.panel.l{left:42px}.panel.r{right:42px}
.panel img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;display:block}
.band{position:absolute;left:0;right:0;bottom:0;padding:26px 18px 28px;text-align:center;color:#fff}
.band h2{font-weight:800;font-size:76px;letter-spacing:-1px;line-height:1}
.band p{font-weight:700;font-size:34px;margin-top:8px;opacity:.95}
.l .band{background:linear-gradient(180deg,rgba(225,29,72,.0),rgba(225,29,72,.92) 38%)}
.r .band{background:linear-gradient(180deg,rgba(10,143,74,.0),rgba(10,143,74,.92) 38%)}
.vs{position:absolute;left:50%;top:690px;transform:translateX(-50%);width:150px;height:150px;border-radius:50%;background:#d97757;color:#fff;font-weight:800;font-size:64px;display:flex;align-items:center;justify-content:center;border:10px solid #fff;box-shadow:0 14px 34px rgba(217,119,87,.5);z-index:5}
.more{position:absolute;left:0;top:1235px;width:1080px;display:flex;justify-content:center}
.more span{background:#f1f5f9;color:#334155;font-weight:700;font-size:40px;padding:10px 38px;border-radius:50px;border:3px solid #e2e8f0}
.char{position:absolute;left:50%;transform:translateX(-50%);top:1320px;height:490px}
.wm{position:absolute;left:0;bottom:55px;width:1080px;text-align:center;font-weight:700;font-size:42px;color:#374151}
</style></head><body>
<div class="glow"></div>
<div class="pill"><span>WHAT'S THE DIFFERENCE?</span></div>
<div class="panel l"><img src="assets/mbr_full.jpg" alt=""><div class="band"><h2>RULER</h2><p>Sheikh Mohammed</p></div></div>
<div class="panel r"><img src="assets/mbz_full.jpg" alt=""><div class="band"><h2>PRESIDENT</h2><p>Sheikh Mohamed</p></div></div>
<div class="vs">VS</div>
<div class="more"><span>7 Rulers · 1 President</span></div>
<img class="char" src="assets/pose_think.png" alt="">
<div class="wm">@fyze.ai</div>
</body></html>
