<!doctype html><html lang="en"><head><meta charset="UTF-8"><style>
@font-face{font-family:"PopFz";font-weight:800;src:url("assets/fonts/pop800.woff2") format("woff2")}
@font-face{font-family:"PopFz";font-weight:700;src:url("assets/fonts/pop700.woff2") format("woff2")}
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#fff;font-family:"PopFz",sans-serif;position:relative;overflow:hidden;color:#0b0b14}
.glow{position:absolute;left:-250px;top:800px;width:1580px;height:1100px;background:radial-gradient(closest-side,#e8efff,#fff 78%)}
.pill{position:absolute;left:0;top:190px;width:1080px;display:flex;justify-content:center}
.pill span{background:#0b0b14;color:#fff;font-weight:800;font-size:44px;padding:12px 46px;border-radius:60px;letter-spacing:1.5px}
.t{position:absolute;left:0;width:1080px;height:110px;line-height:110px;text-align:center;font-weight:800;letter-spacing:-2px;white-space:nowrap;font-size:92px}
.ph{position:absolute;left:150px;width:780px;height:340px;border-radius:34px;overflow:hidden;box-shadow:0 22px 54px rgba(0,0,0,.30);border:8px solid #fff}
.ph img{width:100%;height:100%;object-fit:cover;object-position:50% 22%;display:block}
.vs{position:absolute;left:0;width:1080px;text-align:center;font-weight:800;font-size:150px;line-height:150px;letter-spacing:-4px;font-style:italic;color:#fff;paint-order:stroke fill;-webkit-text-stroke:14px #2330c9;z-index:5}
.char{position:absolute;left:50%;transform:translateX(-50%);top:1340px;height:470px}
.wm{position:absolute;left:0;bottom:55px;width:1080px;text-align:center;font-weight:700;font-size:42px;color:#374151}
</style></head><body>
<div class="glow"></div>
<div class="pill"><span>WHAT'S THE DIFFERENCE?</span></div>
<div class="t" style="top:300px;color:#1d4ed8">Crown Prince</div>
<div class="ph" style="top:420px"><img style="object-position:50% 28%" src="assets/fazza_tile.jpg" alt=""></div>
<div class="vs" style="top:715px">VS</div>
<div class="ph" style="top:850px"><img style="object-position:50% 36%" src="assets/mohammed_tile.jpg" alt=""></div>
<div class="t" style="top:1210px;color:#b45309">Ruler of Dubai</div>
<img class="char" src="assets/pose_think.png" alt="">
<div class="wm">@fyze.ai</div>
</body></html>
