<!doctype html><html lang="en"><head><meta charset="UTF-8"><style>
@font-face{font-family:"PopFz";font-weight:800;src:url("assets/fonts/pop800.woff2") format("woff2")}
@font-face{font-family:"PopFz";font-weight:700;src:url("assets/fonts/pop700.woff2") format("woff2")}
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#fff;font-family:"PopFz",sans-serif;position:relative;overflow:hidden;color:#0b0b14}
.glow{position:absolute;left:-250px;top:700px;width:1580px;height:1200px;background:radial-gradient(closest-side,#fff1e6,#fff 78%)}
.pill{position:absolute;left:0;top:170px;width:1080px;display:flex;justify-content:center}
.pill span{background:#0b0b14;color:#fff;font-weight:800;font-size:44px;padding:12px 46px;border-radius:60px;letter-spacing:1.5px}
.h{position:absolute;left:0;top:290px;width:1080px;text-align:center;font-weight:800;font-size:84px;letter-spacing:-2px;line-height:96px}
.h b{color:#1d4ed8}.h i{color:#b45309;font-style:normal}
.ph{position:absolute;top:470px;width:420px;height:560px;border-radius:30px;overflow:hidden;box-shadow:0 22px 54px rgba(0,0,0,.30);border:8px solid #fff}
.ph img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block}
.l{left:95px}.r{left:565px}
.vs{position:absolute;left:0;top:690px;width:1080px;text-align:center;font-weight:800;font-size:130px;line-height:130px;letter-spacing:-4px;font-style:italic;color:#fff;paint-order:stroke fill;-webkit-text-stroke:14px #2330c9;z-index:5}
.char{position:absolute;left:50%;transform:translateX(-50%);top:1130px;height:670px}
.wm{position:absolute;left:0;bottom:55px;width:1080px;text-align:center;font-weight:700;font-size:42px;color:#374151}
</style></head><body>
<div class="glow"></div>
<div class="pill"><span>WHAT'S THE DIFFERENCE?</span></div>
<div class="h"><b>Crown Prince</b> vs <i>Ruler</i></div>
<div class="ph l"><img src="assets/fazza_tile.jpg" alt=""></div>
<div class="ph r"><img src="assets/mohammed_tile.jpg" alt=""></div>
<div class="vs">VS</div>
<img class="char" src="assets/pose_think.png" alt="">
<div class="wm">@fyze.ai</div>
</body></html>
