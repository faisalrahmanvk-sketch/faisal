<!doctype html><html lang="en"><head><meta charset="UTF-8"><style>
@font-face{font-family:"PopFz";font-weight:800;src:url("assets/fonts/pop800.woff2") format("woff2")}
@font-face{font-family:"PopFz";font-weight:700;src:url("assets/fonts/pop700.woff2") format("woff2")}
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#fff;font-family:"PopFz",sans-serif;position:relative;overflow:hidden;color:#0b0b14}
.glow{position:absolute;left:-250px;top:700px;width:1580px;height:1200px;background:radial-gradient(closest-side,#e6ecff,#fff 78%)}
.pill{position:absolute;left:0;top:210px;width:1080px;display:flex;justify-content:center}
.pill span{background:#2330c9;color:#fff;font-weight:800;font-size:44px;padding:12px 44px;border-radius:60px;letter-spacing:1.5px}
.t{position:absolute;left:0;width:1080px;text-align:center;font-weight:800;letter-spacing:-3px;line-height:1.05;white-space:nowrap}
.t1{top:335px;font-size:150px;color:#2330c9}
.t2{top:530px;font-size:64px;color:#334155;letter-spacing:-1px}
.grid{position:absolute;left:50px;top:720px;width:980px;display:grid;grid-template-columns:1fr 1fr;gap:26px}
.cell{position:relative;height:330px;border-radius:30px;overflow:hidden;box-shadow:0 18px 44px rgba(0,0,0,.26);border:6px solid #fff}
.cell img{width:100%;height:100%;object-fit:cover;display:block}
.cell b{position:absolute;left:16px;bottom:14px;background:#fff;color:#0b0b14;font-weight:800;font-size:40px;padding:6px 22px;border-radius:30px;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.l1{transform:rotate(-2deg)}.r1{transform:rotate(2deg)}.l2{transform:rotate(2deg)}.r2{transform:rotate(-2deg)}
.char{position:absolute;left:50%;transform:translateX(-50%);top:1450px;height:360px}
.wm{position:absolute;left:0;bottom:50px;width:1080px;text-align:center;font-weight:700;font-size:42px;color:#374151}
</style></head><body>
<div class="glow"></div>
<div class="pill"><span>WHAT'S THE DIFFERENCE?</span></div>
<div class="t t1">UAE Airlines</div>
<div class="t t2">Dubai · Abu Dhabi · Sharjah</div>
<div class="grid">
<div class="cell l1"><img src="assets/emirates.jpg" alt=""><b>Emirates</b></div>
<div class="cell r1"><img src="assets/etihad.jpg" alt=""><b>Etihad</b></div>
<div class="cell l2"><img src="assets/flydubai.jpg" alt=""><b>flydubai</b></div>
<div class="cell r2"><img src="assets/airarabia.jpg" alt=""><b>Air Arabia</b></div>
</div>
<img class="char" src="assets/pose_think.png" alt="">
<div class="wm">@fyze.ai</div>
</body></html>
